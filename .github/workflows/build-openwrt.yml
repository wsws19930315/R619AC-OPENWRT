#=============================================================
# R619AC (竞斗云2.0) OpenWRT 25.12 自动编译
# 基于 P3TERX/Actions-OpenWrt 模板
# 源码：OpenWRT 官方 v25.12.6，仅移植 6.12.113 内核补丁
# 科学上网：Passwall
#=============================================================

name: Build OpenWrt for R619AC

on:
  # 手动触发
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH 远程调试（用于 menuconfig）'
        required: false
        default: 'false'
        type: boolean

  # 定时编译（可选，每月1号自动编译）
  # schedule:
  #   - cron: '0 2 1 * *'

  # 推送 .config 文件时自动触发
  push:
    branches:
      - main
    paths:
      - '.config'
      - 'diy-part1.sh'
      - 'diy-part2.sh'
      - 'scripts/**'
      - 'tests/**'
      - 'patches/**'
      - 'files/**'
      - '.gitattributes'
      - '.github/workflows/build-openwrt.yml'

env:
  REPO_URL: https://git.openwrt.org/openwrt/openwrt.git
  REPO_BRANCH: v25.12.6
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
    - name: 检出仓库代码
      uses: actions/checkout@v4

    - name: 检查构建校验脚本
      run: |
        for script in diy-part1.sh diy-part2.sh scripts/*.sh; do
          bash -n "$script"
        done
        sh -n files/usr/libexec/r619ac-storage-guard.sh
        sh -n files/etc/uci-defaults/90-r619ac-runtime-fixes
        python3 -m unittest discover -s tests -v

    - name: 初始化编译环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghcli
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
          g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev \
          libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev \
          libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lld llvm lrzsz mkisofs msmtp \
          nano ninja-build p7zip p7zip-full patch pkgconf python2.7 python3 python3-pip python3-ply \
          python3-docutils python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig \
          texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: 克隆 OpenWRT 源码
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: 加载自定义 feeds（diy-part1.sh）
      run: |
        [ -e $FEEDS_CONF ] && cp $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: 更新 feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: 安装 feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: 加载自定义配置（diy-part2.sh）
      run: |
        [ -e files ] && mv files openwrt/files
        [ -e $CONFIG_FILE ] && cp $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: 整理配置并校验 APK、中文和必需组件
      run: |
        cd openwrt
        make defconfig
        cp .config .config.full
        bash "$GITHUB_WORKSPACE/scripts/check-build.sh" config
        {
          echo "R619AC build repo: $GITHUB_SHA"
          echo "OpenWrt: $REPO_BRANCH $(git rev-parse HEAD)"
          echo 'Kernel backport: 8303e9b2a004a6c3754aaa1edb32cfc7c0cfe55b (generic/ipq40xx only)'
          cat target/linux/generic/kernel-6.12
          for feed in packages luci routing telephony video passwall_luci passwall_packages; do
            echo "$feed: $(git -C "feeds/$feed" rev-parse HEAD)"
          done
          for package in lucky; do
            echo "$package: $(git -C "package/$package" rev-parse HEAD)"
          done
          echo 'Go: 1.27.3 (official packages feed)'
          echo 'Samba: 4.22.11 (same-branch security update; patches/packages/100-samba-4.22.11.patch)'
          sha256sum "$GITHUB_WORKSPACE"/patches/packages/*.patch \
            "$GITHUB_WORKSPACE"/patches/openwrt/*.patch
        } > build-sources.txt

    - name: 导出完整配置和源码版本
      uses: actions/upload-artifact@v4
      if: (!cancelled())
      with:
        name: defconfig-full
        path: |
          openwrt/.config.full
          openwrt/build-sources.txt

    - name: SSH 远程调试（可选）
      uses: P3TERX/ssh2actions@v1.0.0
      if: (github.event.inputs.ssh == 'true') || contains(github.event.action, 'ssh')
      env:
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

    - name: 下载编译依赖
      id: package
      run: |
        cd openwrt
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: 编译固件
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: 校验固件组件和关键安全版本
      id: verify
      run: |
        cd openwrt
        bash "$GITHUB_WORKSPACE/scripts/check-build.sh" firmware
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 检查磁盘空间
      if: (!cancelled())
      run: df -hT

    - name: 整理固件文件
      id: organize
      if: steps.verify.outputs.status == 'success' && !cancelled()
      run: |
        cp openwrt/build-sources.txt openwrt/bin/targets/ipq40xx/generic/
        cp openwrt/.config.full openwrt/bin/targets/ipq40xx/generic/build.config
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 上传固件到 Artifacts
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      with:
        name: OpenWrt_R619AC_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: 生成 Release Tag
      id: tag
      if: steps.organize.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        echo "release_tag=25.12.6-kernel-6.12.113-test_$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
        touch release.txt
        echo "## R619AC OpenWRT 固件" >> release.txt
        echo "" >> release.txt
        echo "- 源码：OpenWRT 官方 ${{ env.REPO_BRANCH }}" >> release.txt
        echo "- 内核：仅移植官方 6.12.113 更新及 generic/ipq40xx 配套补丁；其余基线恢复为 012d8f7。" >> release.txt
        echo "- 设备：P&W R619AC 128M" >> release.txt
        echo "- 编译时间：$(date +"%Y-%m-%d %H:%M")" >> release.txt
        echo "- 包含：Passwall + LuCI 中文 + 基础工具" >> release.txt
        echo "- 状态：25.12 迁移测试版，编译及组件校验不等于实机验收通过。" >> release.txt
        echo "" >> release.txt
        echo "### 刷机建议" >> release.txt
        echo "" >> release.txt
        echo "1. 仅适用于 R619AC 128M，先备份配置、Lucky 数据及 Passwall 自定义规则，备好恢复固件和 OpBoot。" >> release.txt
        echo "2. OpBoot 首次安装、救援及 24.10 跨版本迁移：先刷官方原始精简版 25.12.6 factory.ubi 打底，再从官方 LuCI 保留基础配置刷本 Release 的 sysupgrade.bin。" >> release.txt
        echo "3. 已正常运行本仓库 25.12 的同分支升级可使用 LuCI；镜像校验不通过时不要强制升级。" >> release.txt
        echo "4. 旧配置应分项恢复，旧 IPK、24.10 软件源及内核模块不能复用；详细文件、官方链接和步骤见 README。" >> release.txt
        echo "   本版不是官方原版 25.12.6；不能混装官方 6.12.112 内核模块，也不要强制忽略依赖或整机执行 apk upgrade。" >> release.txt
        echo "5. 验证 LAN/WAN、双频 WiFi、Passwall、Lucky、硬盘挂载、共享、DLNA 和下载。" >> release.txt
        echo "" >> release.txt
        echo "### 维护修复" >> release.txt
        echo "- Samba 更新至 4.22.11，补齐同分支安全修复。" >> release.txt
        echo "- 修正无效的 Passwall 官方 APK 源，补齐 LuCI 本机 HTTPS 证书生成依赖。" >> release.txt
        echo "- Transmission 增加外接存储挂载保护，仅停用未修改的 HAProxy 默认示例服务。" >> release.txt
        echo "- 不修改 SSH root 密码登录策略、Lucky 证书或已有自定义 HAProxy 配置。" >> release.txt
        echo "- 全新生成的双频 WiFi 默认开启，SSID 为 OpenWrt、无密码，仅用于首次配置；请立即设置无线和管理密码。保留配置升级不覆盖已有无线设置。" >> release.txt
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 发布 Release
      uses: softprops/action-gh-release@master
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        prerelease: true
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*

    - name: 清理旧的 workflow 记录
      uses: Mattraks/delete-workflow-runs@main
      with:
        retain_days: 30
        keep_minimum_runs: 3

    - name: 清理旧的 Release
      uses: dev-drprasad/delete-older-releases@master
      if: steps.tag.outputs.status == 'success' && !cancelled()
      with:
        keep_latest: 5
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
